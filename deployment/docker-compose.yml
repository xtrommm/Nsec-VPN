version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nsecvpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nsecvpn_db
      POSTGRES_USER: nsecvpn_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nsec_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsecvpn_admin -d nsecvpn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nsecvpn-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://nsecvpn_admin:${DB_PASSWORD}@postgres:5432/nsecvpn_db
      JWT_SECRET: ${JWT_SECRET:?Required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nsecvpn.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://admin.nsecvpn.com}
    ports:
      - "127.0.0.1:3001:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nsec_net

  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
    container_name: nsecvpn-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - backend
    networks:
      - nsec_net

volumes:
  postgres_data:

networks:
  nsec_net:
    driver: bridge
