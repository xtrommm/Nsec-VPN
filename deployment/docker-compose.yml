version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nsecvpn-postgres
    restart: always
    environment:
      POSTGRES_DB: nsecvpn_db
      POSTGRES_USER: nsecvpn_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nsecvpn_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nsec_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsecvpn_admin -d nsecvpn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nsecvpn-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nsecvpn_admin:${DB_PASSWORD:-nsecvpn_secure_pass_2026}@postgres:5432/nsecvpn_db
      JWT_SECRET: ${JWT_SECRET:-nsec_super_secret_jwt_key_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nsecvpn.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecure2026!}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nsec_net

  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
    container_name: nsecvpn-admin
    restart: always
    depends_on:
      - backend
    networks:
      - nsec_net

  proxy:
    image: nginx:alpine
    container_name: nsecvpn-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - admin-panel
    networks:
      - nsec_net

volumes:
  postgres_data:

networks:
  nsec_net:
    driver: bridge
