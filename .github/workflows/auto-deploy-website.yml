
name: Nsec VPN - Auto Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin-panel/**'
      - '.github/workflows/auto-deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nsecvpn-production
  cancel-in-progress: false

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nsecvpn_ci?schema=public
      JWT_SECRET: ci_pipeline_test_jwt_secret_nsec_vpn_2026
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run backend tests
        run: npm test -- --runInBand --detectOpenHandles --forceExit

      - name: Build backend
        run: npm run build

  build:
    name: Build and Publish Website
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/xtrommm/nsec-vpn-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish Admin Panel
        uses: docker/build-push-action@v6
        with:
          context: ./admin-panel
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/xtrommm/nsec-vpn-admin:sha-${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    name: Auto Deploy Production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.NSEC_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.NSEC_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/nsec_deploy"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/nsec_deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy Git commit
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.NSEC_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.NSEC_DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/nsec_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $SHA"

      - name: Verify live API
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 \
            https://api.nsecvpn.com/ready

      - name: Verify live Admin
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 \
            -o /dev/null \
            https://admin.nsecvpn.com/
