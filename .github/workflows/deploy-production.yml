name: Nsec VPN - Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: nsecvpn-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Production Release
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Identify release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Release commit: ${GITHUB_SHA}"

      - name: Verify main branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: Production deployment is restricted to main."
            exit 1
          fi

      - name: Verify CI success for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking successful CI execution for $SHA"

          gh api -X GET \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=100" \
            | jq -e --arg sha "$SHA" '
                .workflow_runs |
                any(.[];
                  .head_sha == $sha and
                  .event == "push" and
                  .status == "completed" and
                  .conclusion == "success"
                )
              '

          echo "CI verification passed."

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published Docker images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${OWNER,,}"

          echo "Checking backend image..."
          docker buildx imagetools inspect \
            "ghcr.io/$OWNER/nsec-vpn-backend:sha-$SHA" \
            >/dev/null

          echo "Checking admin image..."
          docker buildx imagetools inspect \
            "ghcr.io/$OWNER/nsec-vpn-admin:sha-$SHA" \
            >/dev/null

          echo "Both Docker images verified."

  deploy:
    name: Deploy to Production
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure secure SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.NSEC_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.NSEC_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          umask 077

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_KEY" \
            > "$HOME/.ssh/nsec_deploy"

          printf '%s\n' "$HOST_KEY" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/nsec_deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy release over restricted SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.NSEC_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.NSEC_DEPLOY_USER }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/nsec_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $RELEASE_SHA"

      - name: Verify public production endpoints
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Nsec VPN API..."
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 \
            https://api.nsecvpn.com/ready

          echo
          echo "Checking Nsec VPN Admin..."
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 \
            -o /dev/null \
            https://admin.nsecvpn.com/

          echo "SUCCESS: Production HTTPS checks passed."
