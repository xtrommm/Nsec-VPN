
name: Nsec VPN - Build Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nsecvpn-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: admin
            context: ./admin-panel

    steps:
      - name: Restrict publication to main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: NODE_BUILD_HEAP_MB=4096
          tags: |
            ghcr.io/xtrommm/nsec-vpn-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/xtrommm/Nsec-VPN
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          provenance: false
