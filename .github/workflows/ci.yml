name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  deployment:
    name: Deployment Script Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts
        run: shellcheck deployment/install-wireguard-node.sh scripts/*.sh
      - name: Check restricted website deployment
        run: |
          python3 -m py_compile deployment/deploy-website.py deployment/website-deploy-entry.py deployment/install-website-deployer.py
          python3 -m unittest discover -s tests/deployment -p 'test_*.py'
      - name: Verify idempotent firewall setup and teardown
        run: python3 tests/deployment/firewall_test.py

  backend:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nsecvpn_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nsecvpn_ci?schema=public"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Generate ephemeral test signing key
        run: node -e "process.stdout.write('JWT_SECRET='+require('crypto').randomBytes(32).toString('hex')+'\n')" >> "$GITHUB_ENV"
      - name: Install Dependencies
        run: |
          cd backend
          npm ci
      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate
      - name: Type check
        working-directory: backend
        run: npm run lint
      - name: Run Tests
        working-directory: backend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --runInBand --detectOpenHandles

      - name: Build TypeScript
        working-directory: backend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Database migrations and concurrency integration
        working-directory: backend
        run: npx prisma migrate deploy && npm run test:integration

      - name: Validate production Docker build
        run: docker build --build-arg NODE_BUILD_HEAP_MB=4096 -t nsecvpn-backend-ci ./backend
        working-directory: .

  admin-panel:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json
      - name: Install Dependencies
        run: |
          cd admin-panel
          npm ci
      - name: Validate and test panel
        working-directory: admin-panel
        run: npm run lint && npm test
      - name: Build React Vite Bundle
        run: |
          cd admin-panel
          npm run build

  agent:
    name: WireGuard Node Agent Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json
      - name: Install Dependencies
        run: |
          cd agent
          npm ci
      - name: Validate and test agent
        working-directory: agent
        run: npm run lint && npm test
      - name: Build Agent
        run: |
          cd agent
          npm run build

  android:
    name: Android Client Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate CI Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Nsec VPN,C=US"

      - name: Validate Android backup policies
        run: |
          python3 scripts/check-android-backups.py
          python3 -m unittest discover -s tests/android-config -p 'test_*.py'

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest :speedtest-helper:testDebugUnitTest --no-daemon --warning-mode all -Dorg.gradle.deprecation.trace=true

      - name: Android lint
        run: ./gradlew :app:lintDebug :app:lintRelease :speedtest-helper:lintDebug :speedtest-helper:lintRelease --continue --no-daemon --warning-mode all -Dorg.gradle.deprecation.trace=true
      - name: Print complete Android lint report
        if: always()
        shell: bash
        run: |
          for module in app speedtest-helper; do
            for variant in debug release; do
              report="$module/build/reports/lint-results-$variant.txt"
              fallback="$module/build/intermediates/lint_intermediate_text_report/$variant/lintReport${variant^}/lint-results-$variant.txt"
              if [[ -f "$report" ]]; then
                cat "$report"
              elif [[ -f "$fallback" ]]; then
                cat "$fallback"
              else
                echo "No $module $variant lint text report was generated; inspect the preceding Gradle error."
              fi
            done
          done
      - name: Build debug and validation release APKs
        # This job has only an ephemeral debug key; its release APK is not for publishing.
        run: ./gradlew :app:assembleDebug :app:assembleRelease :speedtest-helper:assembleDebug :speedtest-helper:assembleRelease --no-daemon --warning-mode all -Dorg.gradle.deprecation.trace=true
