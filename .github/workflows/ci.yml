name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nsecvpn_ci?schema=public"
      JWT_SECRET: "ci_pipeline_test_jwt_secret_nsec_vpn_2026"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        run: |
          cd backend
          npm ci
      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate
      - name: Run Tests
        run: |
          cd backend
          npm test -- --detectOpenHandles --forceExit
      - name: Build TypeScript
        run: |
          cd backend
          npm run build

  admin-panel:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json
      - name: Install Dependencies
        run: |
          cd admin-panel
          npm ci
      - name: Build React Vite Bundle
        run: |
          cd admin-panel
          npm run build

  agent:
    name: WireGuard Node Agent Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json
      - name: Install Dependencies
        run: |
          cd agent
          npm ci
      - name: Build Agent
        run: |
          cd agent
          npm run build

  android:
    name: Android Client Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

