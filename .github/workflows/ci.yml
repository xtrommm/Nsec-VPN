name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        run: |
          cd backend
          npm ci
      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate
      - name: Run Tests
        run: |
          cd backend
          npm test
      - name: Build TypeScript
        run: |
          cd backend
          npm run build

  admin-panel:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json
      - name: Install Dependencies
        run: |
          cd admin-panel
          npm ci
      - name: Build React Vite Bundle
        run: |
          cd admin-panel
          npm run build

  agent:
    name: WireGuard Node Agent Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json
      - name: Install Dependencies
        run: |
          cd agent
          npm ci
      - name: Build Agent
        run: |
          cd agent
          npm run build
